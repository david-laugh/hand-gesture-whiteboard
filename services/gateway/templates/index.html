<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손동작 화이트보드</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header><h1>카메라 프레임 전송</h1><p>카메라 JPEG 프레임을 MQTT로 전송합니다.</p></header>
  <main>
    <section class="controls" aria-label="카메라 제어">
      <button id="start">카메라 시작</button><button id="stop" disabled>중지</button>
      <label>FPS <select id="fps"><option>10</option><option selected>20</option><option>30</option></select></label>
      <p id="status" role="status">연결 대기 중</p>
    </section>
    <div class="panels">
      <section><h2>카메라 미리보기</h2><div class="preview"><video id="video" autoplay muted playsinline></video></div></section>
    </div>
    <p id="metrics">아직 전송한 프레임이 없습니다.</p>
    <p class="hint">카메라는 localhost 또는 HTTPS에서 사용할 수 있습니다. MQTT 브로커가 연결되어 있어야 프레임을 전송할 수 있습니다.</p>
  </main>
</body>
</html>
