<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카메라 전송</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header><h1>카메라 전송</h1><p>카메라 프레임을 MQTT로 보냅니다.</p></header>
  <main>
    <section class="controls" aria-label="카메라 제어">
      <button id="start">시작</button><button id="stop" disabled>중지</button>
      <p id="status" role="status">대기 중</p>
    </section>
    <div class="panels">
      <div class="preview"><video id="video" autoplay muted playsinline></video></div>
    </div>
    <p class="hint">카메라는 HTTPS 연결이 필요합니다.</p>
  </main>
</body>
</html>
