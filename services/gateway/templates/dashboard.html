<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>카메라 전송</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <script type="module" src="/static/dashboard.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">CAMERA STREAM</p>
    <h1>카메라 전송</h1>
    <p class="summary">휴대폰 카메라 프레임을 MQTT로 전송합니다.</p>
    <section class="card" aria-live="polite">
      <p class="label">연결 상태</p>
      <p id="connection" class="state">확인 중</p>
      <dl>
        <div><dt>수신 프레임</dt><dd id="received">0</dd></div>
        <div><dt>발행 프레임</dt><dd id="published">0</dd></div>
        <div><dt>드롭</dt><dd id="dropped">0</dd></div>
      </dl>
    </section>
    <section class="qr-card">
      <img src="/qr.png" alt="카메라 페이지 QR 코드">
      <div><p class="label">휴대폰 카메라</p><a id="camera-link" class="camera-link" href="/cam">카메라 열기</a><p id="camera-url" class="url"></p></div>
    </section>
    <p class="hint">휴대폰에서는 Cloudflare Tunnel이 출력한 HTTPS 주소로 접속하세요.</p>
  </main>
</body>
</html>
